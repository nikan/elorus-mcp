name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Verify published package excludes tests and fixtures
        run: |
          FILES=$(npm pack --dry-run --json | node -e "
            let data = '';
            process.stdin.on('data', (d) => (data += d));
            process.stdin.on('end', () => {
              const [pkg] = JSON.parse(data);
              console.log(pkg.files.map((f) => f.path).join('\n'));
            });
          ")
          if echo "$FILES" | grep -qE '__tests__|fixtures'; then
            echo "Published package includes test/fixture files:"
            echo "$FILES" | grep -E '__tests__|fixtures'
            exit 1
          fi
